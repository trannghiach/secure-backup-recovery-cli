[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sbackup"
version = "1.0.0"
description = "Secure Backup CLI Tool - Lab Assignment Group 4"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  # {name = "Ten Sinh Vien 1", email = "sv1@university.edu.vn"},
  # {name = "Ten Sinh Vien 2", email = "sv2@university.edu.vn"}
]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0"
]

# [QUAN TRỌNG] Tạo lệnh 'sbackup' trong terminal
[project.scripts]
sbackup = "sbackup.main:app"

# Cấu hình để pip tự tìm thấy code trong folder src
[tool.setuptools.packages.find]
where = ["src"]